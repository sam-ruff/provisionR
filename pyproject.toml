[project]
name = "provisionr"
version = "1.2.3"
description = "An application for generating Kickstart files on the fly with a GUI for configuration."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "petname>=2.9",
    "libpass>=1.9.4",
]

[project.scripts]
provisionr = "main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["provisionR"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "httpx2>=2.16.0",
    "ruff>=0.17.4",
    "pre-commit>=4.7.0",
]

[tool.ruff.lint]
# Ruff 0.17 widened its default rule set; keep the rules this project enforces.
select = ["E4", "E7", "E9", "F"]
